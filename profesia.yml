name: Aktualizácia ponúk
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python import_jobs.py
        env:
          PROFESIA_FEED_URL: ${{ secrets.PROFESIA_FEED_URL }}
      - run: |
          git config user.name 'jobs-bot'
          git config user.email 'jobs-bot@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet || (git commit -m 'Aktualizácia ponúk' && git push)

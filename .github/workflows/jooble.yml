name: JobStudent – Jooble a GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jobstudent-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python import_jobs.py
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p public
          cp index.html styles.css script.js jobs.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
